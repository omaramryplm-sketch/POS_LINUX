services:
  backend:
    build:
      context: ./omnistock-pos/server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - db_data:/app/prisma/data
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=*
      - DATABASE_URL=file:./data/omnistock.db

  frontend:
    build:
      context: ./omnistock-pos/client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db_data:
