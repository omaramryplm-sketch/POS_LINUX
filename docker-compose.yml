version: '3.8'

services:
  backend:
    build:
      context: ./omnistock-pos/server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/prisma/data
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:./data/omnistock.db

  frontend:
    build:
      context: ./omnistock-pos/client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
